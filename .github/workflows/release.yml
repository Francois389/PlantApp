name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (ex: v1.2.3)"
        required: true
        type: string
      draft:
        description: "Mettre la release en draft"
        required: false
        type: boolean
        default: false
      skip_version_check:
        description: "Ignorer la vérification tag / fichier VERSION (construit la version saisie même si VERSION est différent)"
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "v*.*.*"

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.value }}
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: true

      # Les valeurs saisies passent par env (jamais interpolées dans le script)
      # pour éviter toute injection de commandes depuis une saisie manuelle.
      - name: Read requested tag
        id: raw
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "tag=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Normalize tag
        id: tag
        env:
          RAW_TAG: ${{ steps.raw.outputs.tag }}
        run: |
          tag="$(printf '%s' "$RAW_TAG" | tr -d '[:space:]')"
          if [ "$tag" != "$RAW_TAG" ]; then
            echo "::warning::Le tag '$RAW_TAG' contenait des espaces, corrigé en '$tag'."
          fi

          case "$tag" in
            V*)
              echo "::warning::Le tag '$tag' commence par un 'V' majuscule, corrigé en 'v${tag#V}'."
              tag="v${tag#V}"
              ;;
            v*)
              ;;
            *)
              echo "::warning::Le tag '$tag' n'a pas de préfixe 'v', corrigé en 'v$tag'."
              tag="v$tag"
              ;;
          esac

          echo "value=$tag" >> "$GITHUB_OUTPUT"

      - name: Validate tag format
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version invalide '$TAG' (format attendu : vX.Y.Z)"
            exit 1
          fi

      - name: Derive version from tag
        id: version
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: echo "value=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Read VERSION file
        id: file
        run: |
          file_version="$(tr -d '[:space:]' < VERSION 2>/dev/null || true)"

          case "$file_version" in
            [vV]*)
              echo "::warning::Le fichier VERSION contient '$file_version' avec un préfixe 'v' : il ne doit contenir que '${file_version#[vV]}'. Pense à le corriger dans le dépôt."
              file_version="${file_version#[vV]}"
              ;;
          esac

          echo "value=$file_version" >> "$GITHUB_OUTPUT"

      - name: Check tag / VERSION consistency
        env:
          VERSION: ${{ steps.version.outputs.value }}
          FILE_VERSION: ${{ steps.file.outputs.value }}
          SKIP_CHECK: ${{ inputs.skip_version_check }}
        run: |
          if [ "$FILE_VERSION" = "$VERSION" ]; then
            exit 0
          fi

          msg="Incohérence : la release demande '$VERSION' mais le fichier VERSION contient '${FILE_VERSION:-<absent ou vide>}'. Mets à jour VERSION avant de tagger."
          if [ "$SKIP_CHECK" = "true" ]; then
            echo "::warning::$msg Vérification ignorée (skip_version_check), la version '$VERSION' sera construite."
          else
            echo "::error::$msg"
            exit 1
          fi

      - name: Display version
        run: echo "Building version ${{ steps.version.outputs.value }} (tag ${{ steps.tag.outputs.value }})"

      - uses: actions/setup-java@v5.2.0
        with:
          java-version: '25'
          distribution: 'liberica'
          java-package: jdk+fx

      - run : java --version

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Check compilation
        run: ./gradlew compileKotlin
        env:
          PLANTAPP_VERSION: ${{ steps.version.outputs.value }}

  build:
    name: Build ${{ matrix.os.name }} installer
    runs-on: ${{ matrix.os.runner }}
    needs: prepare
    strategy:
      matrix:
        os:
          - name: Linux
            runner: ubuntu-latest
            artifact: "*.deb"
            artifact-name: installer-linux
          - name: Windows
            runner: windows-latest
            artifact: "*.msi"
            artifact-name: installer-windows
          - name: macOS
            runner: macos-latest
            artifact: "*.dmg"
            artifact-name: installer-macos
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: true

      - uses: actions/setup-java@v5.2.0
        with:
          java-version: '25'
          distribution: 'liberica'
          java-package: jdk+fx

      - run : java --version

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build installer
        run: ./gradlew runtime jpackage
        env:
          PLANTAPP_VERSION: ${{ needs.prepare.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os.artifact-name }}
          path: build/jpackage/${{ matrix.os.artifact }}

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [ prepare, build ]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: PlantApp ${{ needs.prepare.outputs.tag }}
          draft: ${{ inputs.draft || false }}
          prerelease: false
          files: artifacts/*