name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (ex: v1.2.3)"
        required: true
        type: string
  push:
    tags:
      - "v*.*.*"

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Display version
        run: echo "Building version ${{ steps.version.outputs.version }}"

      - uses: actions/setup-java@v5.2.0
        with:
          java-version: '25'
          distribution: 'liberica'
          java-package: jdk+fx

      - run : java --version

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Check compilation
        run: ./gradlew compileKotlin
        env:
          PLANTAPP_VERSION: ${{ steps.version.outputs.version }}

  build:
    name: Build ${{ matrix.os.name }} installer
    runs-on: ${{ matrix.os.runner }}
    needs: prepare
    strategy:
      matrix:
        os:
          - name: Linux
            runner: ubuntu-latest
            artifact: "*.deb"
            artifact-name: installer-linux
          - name: Windows
            runner: windows-latest
            artifact: "*.msi"
            artifact-name: installer-windows
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true

      - uses: actions/setup-java@v5.2.0
        with:
          java-version: '25'
          distribution: 'liberica'
          java-package: jdk+fx

      - run : java --version

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build installer
        run: ./gradlew runtime jpackage
        env:
          PLANTAPP_VERSION: ${{ needs.prepare.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os.artifact-name }}
          path: build/jpackage/${{ matrix.os.artifact }}

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [ prepare, build ]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          name: PlantApp ${{ needs.prepare.outputs.version }}
          draft: false
          prerelease: false
          files: artifacts/*